name: CI

# Runs on every pull request and on the deploy branch. With "Wait for CI"
# switched on for the Railway web service, a red run here blocks the deploy.
on:
  pull_request:
  push:
    branches: [claude/evotasks-build-spec-lqe07u]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evotasks_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evotasks_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evotasks_test
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron
      APP_TIMEZONE: Europe/London
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
